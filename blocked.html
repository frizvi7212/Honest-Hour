<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Study Mode — Honest Hour</title>
    <style>
      :root {
        --bg: #0e100f;
        --surface: #17191a;
        --orange: #e64002;
        --blue: #7b8cb8;
        --text: #f2f1ee;
        --text-muted: #9a9d9c;
        --border: rgba(255, 255, 255, 0.08);
      }
      * {
        box-sizing: border-box;
      }
      h1,
      p {
        cursor: default;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        text-align: center;
      }
      .card {
        max-width: 420px;
        width: 100%;
        padding: 32px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 18px;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 8px;
        font-weight: 700;
      }
      p {
        color: var(--text-muted);
        margin: 4px 0;
        font-size: 14px;
      }
      .host {
        color: var(--blue);
        font-weight: 600;
      }
      .timer {
        font-size: 44px;
        font-weight: 700;
        margin: 22px 0;
        font-variant-numeric: tabular-nums;
        color: var(--orange);
      }
      .sub {
        font-size: 12px;
        color: var(--text-muted);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You're in Study Mode</h1>
      <p>
        <span class="host" id="host"></span> is blocked until your session ends.
      </p>
      <div class="timer" id="timer">--:--</div>
      <p class="sub">
        No sneak peeks — this is the commitment you set for yourself.
      </p>
    </div>
    <script src="blocked.js"></script>
  </body>
</html>
