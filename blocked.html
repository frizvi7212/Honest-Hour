<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Study Mode — Honest Hour</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0e100f;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        text-align: center;
      }
      .card {
        max-width: 420px;
        padding: 32px;
      }
      h1 {
        color: #7b8cb8;
        font-size: 22px;
        margin: 0 0 8px;
      }
      p {
        color: #fff;
        margin: 4px 0;
        font-size: 14px;
      }
      .host {
        color: #e64002;
        font-weight: 600;
      }
      .timer {
        font-size: 48px;
        font-weight: 700;
        margin: 24px 0;
        font-variant-numeric: tabular-nums;
        color: #fff;
      }
      .sub {
        font-size: 12px;
        color: #6b7280;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You're in Study Mode</h1>
      <p>
        <span class="host" id="host"></span> is blocked until your session ends.
      </p>
      <div class="timer" id="timer">--:--</div>
      <p class="sub">
        No sneak peeks — this is the commitment you set for yourself.
      </p>
    </div>
    <script src="blocked.js"></script>
  </body>
</html>
