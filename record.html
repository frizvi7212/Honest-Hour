<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Record your nudge voice — Honest Hour</title>
    <style>
      :root {
        --bg: #0e100f;
        --surface: #17191a;
        --orange: #e64002;
        --blue: #7b8cb8;
        --text: #f2f1ee;
        --text-muted: #9a9d9c;
        --border: rgba(255, 255, 255, 0.08);
      }
      * {
        box-sizing: border-box;
      }
      button {
        cursor: pointer;
      }
      button:disabled {
        cursor: not-allowed;
      }
      h1,
      p,
      .timer,
      .status {
        cursor: default;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--text);
      }
      .card {
        max-width: 520px;
        width: 100%;
        padding: 56px 48px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 24px;
        text-align: center;
      }
      h1 {
        font-size: 26px;
        margin: 0 0 8px;
        font-weight: 700;
      }
      p.sub {
        color: var(--text-muted);
        font-size: 14px;
        margin: 4px 0 40px;
        line-height: 1.6;
      }
      .mic-btn {
        width: 128px;
        height: 128px;
        border-radius: 50%;
        border: none;
        background: var(--blue);
        color: #0e100f;
        font-size: 42px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 20px;
        transition: background 0.15s ease;
      }
      .mic-btn.recording {
        background: var(--orange);
        color: #fff;
        animation: pulse 1s infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          box-shadow: 0 0 0 0 rgba(230, 64, 2, 0.45);
        }
        50% {
          box-shadow: 0 0 0 18px rgba(230, 64, 2, 0);
        }
      }
      .timer {
        font-size: 26px;
        font-weight: 700;
        color: var(--orange);
        min-height: 32px;
        font-variant-numeric: tabular-nums;
      }
      .status {
        font-size: 14px;
        margin: 14px 0 6px;
        color: var(--text-muted);
        min-height: 20px;
      }
      .status.live {
        color: var(--orange);
        font-weight: 600;
      }
      .row {
        display: flex;
        gap: 10px;
        justify-content: center;
        margin-top: 24px;
        flex-wrap: wrap;
      }
      button.secondary {
        padding: 9px 16px;
        border-radius: 9px;
        border: 1px solid var(--border);
        background: var(--bg);
        color: var(--text);
        font-size: 13px;
        cursor: pointer;
      }
      button.secondary:hover {
        border-color: var(--blue);
      }
      button.primary {
        padding: 9px 16px;
        border-radius: 9px;
        border: none;
        background: var(--orange);
        color: #fff;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
      }
      button.primary:hover {
        opacity: 0.9;
      }
      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Record your nudge voice</h1>
      <p class="sub">
        This stays on your device — it's never uploaded anywhere. Say something
        short, like "Hey, still there?" (max 5 seconds).
      </p>

      <button id="record-btn" class="mic-btn">🎙️</button>
      <div class="timer" id="timer"></div>
      <div class="status" id="status">Tap the mic to start recording.</div>

      <div id="preview-controls" class="row hidden">
        <button id="play-btn" class="secondary">▶ Preview</button>
        <button id="save-btn" class="primary">Save this clip</button>
        <button id="discard-btn" class="secondary">Discard &amp; retry</button>
      </div>

      <div id="clear-controls" class="row hidden">
        <button id="clear-btn" class="secondary">
          Remove saved clip (use default sound instead)
        </button>
      </div>
    </div>
    <script src="record.js"></script>
  </body>
</html>
